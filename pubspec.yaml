name: rice_tracker
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  go_router: ^17.2.2
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  fpdart: ^1.2.0
  flutter_svg: ^2.2.4
  flutter_native_splash: ^2.4.6
  flutter_sticky_header: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  import_sorter: ^4.6.0
  flutter_launcher_icons: ^0.14.4

# dart run import_sorter:main
import_sorter:
  comments: true
  exports:
    - lib/

# dart run flutter_native_splash:create
flutter_native_splash:
  android: true
  web: false

  color: "#EFF6FF"
  color_dark: "#0F172A"
  image: "assets/images/app_launcher_icon.png"
  image_dark: "assets/images/app_launcher_icon.png"

  android_12:
    image: "assets/images/app_launcher_icon.png"
    icon_background_color: "#EFF6FF"
    image_dark: "assets/images/app_launcher_icon.png"
    icon_background_color_dark: "#0F172A"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/OpenSans-Italic-VariableFont_wdth,wght.ttf
          style: italic
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji-Regular.ttf

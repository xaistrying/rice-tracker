name: rice_tracker
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  go_router: ^17.2.2
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  fpdart: ^1.2.0
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  import_sorter: ^4.6.0

# dart run import_sorter:main
import_sorter:
  comments: true
  exports:
    - lib/

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/OpenSans-Italic-VariableFont_wdth,wght.ttf
          style: italic
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji-Regular.ttf
